services:
  ds2api:
    build:
      context: .
      target: final
    image: ds2api-browser-proxy:local
    container_name: ds2api
    restart: always
    shm_size: "1gb"
    env_file:
      - .env
    ports:
      # Host port is configurable via DS2API_HOST_PORT; container port stays fixed at 5001.
      - "${DS2API_HOST_PORT:-8080}:5001"
    volumes:
      - ./config.json:/data/config.json   # 配置文件（持久化推荐路径）
      - ./browser_profile:/data/browser_profile   # Browser Proxy 登录态持久化目录
    environment:
      - PORT=5001
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - DS2API_ADMIN_KEY=${DS2API_ADMIN_KEY:-ds2api}
      - DS2API_CONFIG_PATH=/data/config.json
